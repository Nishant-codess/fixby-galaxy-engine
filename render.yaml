services:
  - type: web
    name: fixby-galaxy-engine
    env: python
    plan: free
    # Rebuilds the Next.js static export when Node is available.
    # The Python runtime serves src/frontend-next/out (see scripts/render_build.sh).
    buildCommand: bash scripts/render_build.sh
    startCommand: uvicorn src.backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FIXBY_API_KEY
        value: test-api-key-123
      - key: USE_MOCK
        value: "false"
      - key: ENABLE_HEAVY_EMBEDDINGS
        value: "false"
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false


