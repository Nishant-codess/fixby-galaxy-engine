# docker/docker-compose.yml — Fixby Multi-Container Configuration
version: '3.8'

services:
  engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: fixby_engine
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
