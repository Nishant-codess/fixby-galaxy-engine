name: Fixby Galaxy Engine CI

on:
  push:
    branches: [ main, develop, "feat/*" ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint-and-test:
    name: Lint, Test & Benchmark
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8

      - name: Lint with flake8 (syntax errors & undefined names)
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=venv,.venv,docs

      - name: Verify Contract Schemas
        run: |
          python -c "import contracts.schema; print('Contracts verified successfully!')"

      - name: Run Full Pytest Test Suite
        run: |
          pytest -v tests/

      - name: Run Self-Auditing Benchmark Harness
        run: |
          python -m src.backend.benchmark
          test -f metrics.md || (echo "metrics.md missing" && exit 1)
          test -f results.jsonl || (echo "results.jsonl missing" && exit 1)

      - name: Upload Benchmark Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-reports
          path: |
            metrics.md
            results.jsonl
